name: Release NixOS Branding npm package
run-name: ${{ github.actor }} is releasing a new version of the branding npm package

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Never interrupt an in-progress publish; queue the next run instead.
  group: release-npm-package-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-npm-package:
    name: Build and publish npm package
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "latest"
          registry-url: "https://registry.npmjs.org"
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
      - name: Build npm package
        run: |
          nix build .\#nixos-branding.npm-package \
            --print-build-logs \
            --out-link result-npm-package
          mkdir --parents ./build
          cp --recursive --dereference ./result-npm-package/* ./build
      - name: Publish npm package
        run: npm publish
        working-directory: ./build
