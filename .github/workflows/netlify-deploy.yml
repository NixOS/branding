name: Deploy Media Kit
run-name: ${{ github.actor }} is deploying branding assets

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  # Never interrupt an in-progress deploy; queue the next run instead.
  group: netlify-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy media kit to Netlify
    runs-on: ubuntu-latest
    permissions:
      contents: write # Netlify action posts a commit comment
      statuses: write # Netlify action sets a commit status
      deployments: write # Netlify action creates a GitHub deployment
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
      - name: Build Deployed Assets
        run: |
          nix build .\#nixos-branding.deployed-assets \
            --print-build-logs \
            --out-link result-deploy
          mkdir --parents ./build
          cp --recursive --dereference ./result-deploy/* ./build
      - name: 'Publish to Netlify'
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668  # v4.0.0
        env:
          NETLIFY_AUTH_TOKEN: '${{ secrets.NETLIFY_AUTH_TOKEN }}'
          NETLIFY_SITE_ID: '${{ secrets.NETLIFY_SITE_ID }}'
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          deploy-message: 'Published from GitHub Actions'
          publish-dir: './build'
          production-deploy: true
