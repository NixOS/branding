name: Release NixOS Branding Guide
run-name: ${{ github.actor }} is releasing a new version of the branding guide

on:
  push:
    tags:
      - "nixos-branding-guide-v*.*.*"

concurrency:
  # Serialize release runs for a tag; never interrupt a release in progress.
  group: release-guide-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  release:
    name: Create GitHub release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create publishes the release
      id-token: write # sign the build-provenance attestation via OIDC
      attestations: write # write the build-provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3  # v31.10.6
      - name: Split tag name at version
        env:
          TAGNAME: ${{ github.ref_name }}
        id: split
        run: echo "version=${TAGNAME##*-v}" >> "$GITHUB_OUTPUT"
      - name: Check version against tag
        env:
          TAGVERSION: ${{ steps.split.outputs.version }}
        run: |
          BASEVERSION=$(cat ./package-sets/top-level/nixos-branding/nixos-branding-guide/data/version | tr -d '\n')
          if [[ "${TAGVERSION}" == "${BASEVERSION}" ]]; then
            echo "NixOS Branding Guide tag version and file version match"
            exit 0
          else
            echo "NixOS Branding Guide tag version and file version DO NOT match"
            exit 1
          fi
      - name: Build release assets
        run: |
          nix build .\#nixos-branding.release-assets \
            --print-build-logs \
            --out-link result-assets
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: result-assets/*
      - name: Get latest release info
        id: query-release-info
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32  # v3.0.0
        with:
          command: query
          version: latest
          changelog: ./package-sets/top-level/nixos-branding/nixos-branding-guide/CHANGELOG.md
      - name: Display release info
        env:
          VERSION: ${{ steps.query-release-info.outputs.version }}
          RELEASE_DATE: ${{ steps.query-release-info.outputs.release-date }}
          NOTES: ${{ steps.query-release-info.outputs.release-notes }}
        run: |
          printf 'Version: %s\n' "$VERSION"
          printf 'Date: %s\n' "$RELEASE_DATE"
          printf '%s\n' "$NOTES"
      - name: Release notes to file
        env:
          NOTES: ${{ steps.query-release-info.outputs.release-notes }}
        run: printf '%s\n' "$NOTES" > release
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.split.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NixOS Branding Guide v$VERSION" \
            --notes-file release \
            --latest \
            --verify-tag \
            result-assets/*

  deploy:
    uses: ./.github/workflows/netlify-deploy.yml
    needs: release
    permissions:
      contents: write # Netlify action posts a commit comment
      statuses: write # Netlify action sets a commit status
      deployments: write # Netlify action creates a GitHub deployment

  release-npm-package:
    uses: ./.github/workflows/release-npm-package.yaml
    needs: release
    permissions:
      id-token: write # OIDC for npm provenance publish
      contents: read
