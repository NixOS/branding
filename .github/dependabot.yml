version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      # Also scan composite actions under .github/actions/*. A plain
      # "/" does not cover action.yml files, so their pinned actions
      # would otherwise never be updated.
      # https://github.com/dependabot/dependabot-core/issues/6704
      - "/.github/actions/*"
    schedule:
      interval: weekly
    # Dependabot updates both tag-pinned and SHA-pinned action
    # references. PRs from Dependabot follow normal review.
