name: 'Setup Nix'
description: |
  Installs Nix and restores the /nix/store cache. Used by every job in
  check.yml that needs to run nix commands.

  IMPORTANT: the caller must run `actions/checkout@v4` BEFORE referencing
  this composite action. GitHub Actions resolves the composite action's
  path (`./.github/actions/setup-nix/action.yml`) against the runner's
  workspace, which is empty until checkout completes. Including
  `actions/checkout` inside this composite action is chicken-and-egg
  and fails with "Can't find action.yml" before the first step runs.

runs:
  using: 'composite'
  steps:
    - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c  # v31.10.7
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569  # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        gc-max-store-size-linux: 5G
        purge: true
